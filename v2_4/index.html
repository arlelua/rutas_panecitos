<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1769aa"><title>GPS Rutas V2.4</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial;background:#f4f6f7;color:#17202a}
#app{height:100%;display:flex;flex-direction:column}header{height:58px;background:#1769aa;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px}h1{font-size:18px;margin:0}#status{font-size:11px;text-align:right}.ok{color:#b9f6ca}.bad{color:#ffcdd2}
#map{flex:1;min-height:0}.panel{background:#fff;padding:8px;box-shadow:0 -3px 12px #0002;max-height:52vh;overflow:auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
input,textarea,select{width:100%;padding:10px;border:1px solid #ccd1d1;border-radius:8px;font-size:14px}textarea{height:48px}button{border:0;border-radius:9px;padding:11px 7px;font-size:13px;font-weight:bold;background:#e5e7e9;color:#17202a}.primary{background:#1769aa;color:#fff}.green{background:#198754;color:#fff}.orange{background:#ca6f1e;color:#fff}.danger{background:#c0392b;color:#fff}.dark{background:#34495e;color:#fff}
.stats{display:flex;justify-content:space-between;font-size:12px;color:#555;padding:4px}.box{background:#f4f6f7;padding:7px;border-radius:8px;margin-top:6px}#routesPanel{display:none;padding:7px;background:#f8f9f9;border-radius:8px;margin-top:7px}.route{padding:8px;border-bottom:1px solid #ddd;font-size:12px}.route button{padding:6px;margin-left:4px}.small{font-size:11px;color:#667}.draft{background:#fff3cd!important;color:#664d03!important}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9999}.modalbox{background:white;border-radius:12px;padding:15px;width:min(92%,420px);box-shadow:0 10px 35px #0005}.modalbox h3{margin:0 0 10px}.modalbox .row{margin-top:10px}
</style></head><body><div id="app">
<header><h1>📍 GPS Rutas V2.4</h1><div id="status">Listo</div></header><div id="map"></div>
<div class="panel">
<div id="info" class="box">V2.4: recuperación de V2.3 + guardado automático. Las rutas antiguas se leen en modo consulta; las nuevas se guardan en un almacenamiento independiente.</div>
<div class="row"><input id="routeName" value="Ruta nueva" placeholder="Nombre de la ruta"><button class="dark" onclick="toggleRoutes()">📁 Rutas guardadas</button></div>
<div class="row"><button class="primary" onclick="locate()">📍 Mi posición</button><button class="green" id="recBtn" onclick="toggleRec()">▶ Grabar recorrido</button></div>
<div class="row"><button class="orange" onclick="markInterestGPS()">📌 Punto de interés GPS</button><button onclick="markGPSPoint()">➕ Punto GPS</button></div>
<div class="row"><button onclick="finish()">💾 Finalizar y guardar</button><button onclick="newCurrent()">🆕 Nueva ruta</button></div>
<div class="row"><button onclick="backup()">💾 Respaldo nuevas</button><button onclick="document.getElementById('file').click()">📥 Importar JSON</button></div>
<input id="file" type="file" accept=".json,application/json" style="display:none" onchange="importFile(event)">
<div class="stats"><span id="pc">GPS: 0</span><span id="ic">Intereses: 0</span><span id="dc">Distancia: 0 m</span></div>
<textarea id="notes" placeholder="Observaciones"></textarea><div id="routesPanel"></div>
</div></div>
<div id="modal" class="modal"><div class="modalbox"><h3>📌 Punto de interés</h3><div id="modalPos" class="small"></div><label>Categoría</label><input id="poiCat" value="Cliente"><label>Descripción</label><textarea id="poiDesc" placeholder="Descripción del punto"></textarea><div class="row"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="savePOI()">Guardar punto</button></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const OLD_KEYS=['gps_routes_v2_mejorada','gps_routes_v2'];
const NEW_KEY='gps_routes_v2_4';
const DRAFT_KEY='gps_routes_v2_4_draft';
const map=L.map('map').setView([17.64,-101.55],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(map);
let marker=null,circle=null,line=null,poiLayer=L.layerGroup().addTo(map),recording=false,watchId=null,current=blank(),newRoutes=read(NEW_KEY),legacyRoutes=loadLegacy(),pendingPOI=null;
function blank(){return{id:'r_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),name:'Ruta nueva',notes:'',track:[],interests:[],distance:0,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}}
function read(k){try{let x=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function writeNew(){localStorage.setItem(NEW_KEY,JSON.stringify(newRoutes))}
function loadLegacy(){let out=[];for(const k of OLD_KEYS){for(const r of read(k)){let n=normalize(r);if(n&&!out.some(x=>x.name===n.name&&x.track.length===n.track.length&&Math.abs((x.distance||0)-(n.distance||0))<1))out.push(n)}}return out}
function normalize(r){if(!r||typeof r!=='object')return null;let track=Array.isArray(r.track)?r.track:(Array.isArray(r.points)?r.points:[]),interests=Array.isArray(r.interests)?r.interests:[];return{id:r.id||('legacy_'+Date.now()+Math.random()),name:r.name||'Ruta sin nombre',notes:r.notes||'',track:track.map(p=>({lat:+p.lat,lng:+p.lng,accuracy:p.accuracy,time:p.time,type:p.type||'Recorrido'})).filter(p=>isFinite(p.lat)&&isFinite(p.lng)),interests:interests.map((p,i)=>({...p,id:p.id??i+1})),distance:+r.distance||dist(track),createdAt:r.createdAt||new Date().toISOString(),updatedAt:r.updatedAt||new Date().toISOString()}}
function hav(a,b,c,d){let R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,q=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function dist(a){let n=0;for(let i=1;i<a.length;i++)n+=hav(a[i-1].lat,a[i-1].lng,a[i].lat,a[i].lng);return n}
function fmt(m){return m<1000?Math.round(m)+' m':(m/1000).toFixed(2)+' km'}
function status(t,ok=true){let e=document.getElementById('status');e.textContent=t;e.className=ok?'ok':'bad'}
function info(t,cls=''){let e=document.getElementById('info');e.textContent=t;e.className='box '+cls}
function updateUI(){pc.textContent='GPS: '+current.track.length.toLocaleString();ic.textContent='Intereses: '+current.interests.length;dc.textContent='Distancia: '+fmt(dist(current.track))}
function redraw(){if(line)map.removeLayer(line);poiLayer.clearLayers();let p=current.track.map(x=>[x.lat,x.lng]);if(p.length)line=L.polyline(p,{weight:4}).addTo(map);current.interests.forEach((x,i)=>{if(isFinite(x.lat)&&isFinite(x.lng))L.marker([x.lat,x.lng]).addTo(poiLayer).bindPopup('<b>Punto de interés '+(x.id??i+1)+'</b><br>'+esc(x.category||x.type||'Punto')+'<br>'+esc(x.description||'')+'<br>'+x.lat+', '+x.lng)});updateUI()}
function persistDraft(){current.updatedAt=new Date().toISOString();localStorage.setItem(DRAFT_KEY,JSON.stringify({app:'GPS Rutas V2.4',recording,route:current,savedAt:new Date().toISOString()}));updateUI()}
function clearDraft(){localStorage.removeItem(DRAFT_KEY)}
function checkDraft(){try{let d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');if(!d||!d.route)return;if(d.route.track?.length||d.route.interests?.length){if(confirm('Hay un recorrido en curso recuperable.\n\nRuta: '+(d.route.name||'Ruta nueva')+'\nGPS: '+(d.route.track?.length||0)+'\nIntereses: '+(d.route.interests?.length||0)+'\n\n¿Continuar?')){current=normalize(d.route);routeName.value=current.name;notes.value=current.notes||'';redraw();if(current.track.length)map.fitBounds(current.track.map(p=>[p.lat,p.lng]),{padding:[20,20]});info('Recorrido recuperado automáticamente. Continúa desde el último punto.','draft');status('Recorrido recuperado')}else{if(confirm('¿Finalizar y guardar este recorrido recuperado?')){current=normalize(d.route);saveCurrent();clearDraft();newCurrent(false)}}}}catch(e){}}
function locate(){navigator.geolocation.getCurrentPosition(p=>position(p,true),e=>status('GPS: '+e.message,false),{enableHighAccuracy:true,timeout:15000,maximumAge:2000})}
function position(p,center){let a=p.coords.latitude,b=p.coords.longitude;if(marker)map.removeLayer(marker);marker=L.marker([a,b]).addTo(map);if(circle)map.removeLayer(circle);circle=L.circle([a,b],{radius:p.coords.accuracy,fillOpacity:.08}).addTo(map);if(center)map.setView([a,b],17);status('GPS ±'+Math.round(p.coords.accuracy)+' m')}
function addTrack(lat,lng,accuracy,type='Recorrido'){let last=current.track.at(-1);if(!last||hav(last.lat,last.lng,lat,lng)>=5){current.track.push({lat,lng,accuracy,time:new Date().toISOString(),type});redraw();persistDraft()}}
function toggleRec(){if(recording){stopRec();status('Recorrido detenido');persistDraft();return}navigator.geolocation.getCurrentPosition(()=>{recording=true;recBtn.textContent='⏹ Detener recorrido';status('Grabando...');persistDraft();watchId=navigator.geolocation.watchPosition(p=>{position(p,false);addTrack(p.coords.latitude,p.coords.longitude,p.coords.accuracy,'Recorrido')},e=>status('Error seguimiento: '+e.message,false),{enableHighAccuracy:true,timeout:20000,maximumAge:2000})},e=>status('GPS: '+e.message,false),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function stopRec(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}recording=false;recBtn.textContent='▶ Grabar recorrido'}
function markGPSPoint(){navigator.geolocation.getCurrentPosition(p=>{position(p,true);addTrack(p.coords.latitude,p.coords.longitude,p.coords.accuracy,'GPS')},e=>status('GPS: '+e.message,false),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function markInterestGPS(){navigator.geolocation.getCurrentPosition(p=>{position(p,true);pendingPOI={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,time:new Date().toISOString()};modalPos.textContent='GPS actual: '+p.coords.latitude.toFixed(7)+', '+p.coords.longitude.toFixed(7)+' · precisión ±'+Math.round(p.coords.accuracy)+' m';poiCat.value='Cliente';poiDesc.value='';modal.style.display='flex';},e=>status('GPS: '+e.message,false),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function savePOI(){if(!pendingPOI)return;current.interests.push({id:current.interests.length+1,...pendingPOI,category:poiCat.value.trim()||'Interés',description:poiDesc.value.trim()});closeModal();redraw();persistDraft();status('Punto de interés guardado en la posición GPS actual')}
function closeModal(){modal.style.display='none';pendingPOI=null}
function saveCurrent(){if(!current.track.length&&!current.interests.length){alert('La ruta está vacía.');return false}current.name=routeName.value.trim()||('Ruta '+(newRoutes.length+1));current.notes=notes.value;current.distance=dist(current.track);current.updatedAt=new Date().toISOString();let copy=JSON.parse(JSON.stringify(current));let ix=newRoutes.findIndex(x=>x.id===copy.id);if(ix>=0)newRoutes[ix]=copy;else newRoutes.push(copy);writeNew();return true}
function finish(){stopRec();if(saveCurrent()){clearDraft();renderRoutes();status('Ruta guardada: '+current.name);alert('Ruta guardada en V2.4. Las rutas anteriores no fueron modificadas.');newCurrent(false)}}
function newCurrent(confirmIt=true){if(confirmIt&&!confirm('¿Comenzar una ruta nueva? La ruta actual ya guardada no se modifica.'))return;stopRec();current=blank();routeName.value='Ruta nueva';notes.value='';clearDraft();redraw();info('Nueva ruta lista. Guardado automático activado.');status('Listo')}
function toggleRoutes(){let p=document.getElementById('routesPanel');p.style.display=p.style.display==='none'?'block':'none';renderRoutes()}
function renderRoutes(){let p=document.getElementById('routesPanel');let all=[...newRoutes.map(r=>({...r,_new:true})),...legacyRoutes.map(r=>({...r,_new:false}))];p.innerHTML=all.length?all.slice().reverse().map((r,i)=>{let idx=r._new?newRoutes.indexOf(r):-1;return '<div class="route"><b>'+esc(r.name)+'</b> '+(r._new?'🆕':'📚')+'<br><span class="small">'+r.track.length.toLocaleString()+' GPS · '+r.interests.length+' intereses · '+fmt(r.distance)+'</span><br><button onclick="openAny('+i+')">Abrir</button>'+(r._new?'<button onclick="exportOne('+idx+')">JSON</button>':'')+'</div>'}).join(''):'<small>No hay rutas.</small>';p._all=all}
function openAny(i){let p=document.getElementById('routesPanel'),r=p._all?.[i];if(!r)return;current=JSON.parse(JSON.stringify(r));routeName.value=current.name;notes.value=current.notes||'';redraw();if(current.track.length)map.fitBounds(current.track.map(p=>[p.lat,p.lng]),{padding:[20,20]});status('Ruta cargada: '+current.name);info(r._new?'Ruta nueva cargada.':'Ruta histórica en modo consulta: no se modificará la original.')}
function backup(){download('RESPALDO_GPS_RUTAS_V2_4.json',{app:'GPS Rutas V2.4',version:'2.4',exportedAt:new Date().toISOString(),routes:newRoutes})}
function exportOne(i){download('RUTA_'+safe(newRoutes[i].name)+'.json',newRoutes[i])}
function importFile(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result),a=[];if(Array.isArray(x))a=x;else if(Array.isArray(x.routes))a=x.routes;else if(x.track||x.points)a=[x];a=a.map(normalize).filter(Boolean);if(!a.length)throw Error('No se encontraron rutas');if(!confirm('Se encontraron '+a.length+' rutas. Se agregarán a V2.4, sin modificar V2 ni V2.3.'))return;for(const r of a){r.id='import_'+Date.now()+'_'+Math.random().toString(36).slice(2);newRoutes.push(r)}writeNew();renderRoutes();alert('Importadas '+a.length+' rutas a V2.4.');}catch(err){alert('No se pudo importar: '+err.message)}finally{e.target.value=''}};rd.readAsText(f)}
function download(name,obj){let b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function safe(x){return String(x).replace(/[^a-z0-9áéíóúñ _-]/gi,'_')}
function esc(x){return String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
window.addEventListener('beforeunload',()=>{if(current.track.length||current.interests.length)persistDraft()});
renderRoutes();redraw();setTimeout(checkDraft,500);
</script></body></html>
